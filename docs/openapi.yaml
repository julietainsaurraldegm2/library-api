# ──────────────────────────────────────────────────────────────
# Schemas: la forma de los datos. Tienen que coincidir con las
# tablas de la base y con las interfaces de src/types/.
# ──────────────────────────────────────────────────────────────
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Book not found

Author:
  type: object
  required: [id, name, nationality]
  properties:
    id:
      type: integer
    name: 
      type: string
    nationality: 
      type: string

Book: 
  type: object
  required: [id, title, year, author_id, available]
  properties:
    id:
      type: integer
    title:
      type: string
    year: 
      type: integer
    author_id:
      type: integer
    available: 
      type: boolean

NewBook:
  type: object
  required: [title, year, author_id]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    year:
      type: integer
      minimum: 1000
      maximum: 2100
    author_id:
      type: integer

UpdateBook:
  type: object
  required: [title, year, author_id]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    year:
      type: integer
      minimum: 1000
      maximum: 2100
    author_id:
      type: integer

BookPage:
  type: object
  required: [data, total, page, limit]
  properties:
    data:
      type: integer
    
Loan: 
  type: object
  required: [id, book_id, member_name, loan_date, return_date]
  properties:
    id: 
      type: integer
    book_id: 
      type: integer
    member_name: 
      type: string
    loan_date:
      type: string
    return_date:
      type: string
      nullable: true
NewLoan:
  type: object
  required: [book_id, member_name]
  properties:
    book_id:
      type: integer
    member_name:
      type: string
      minLength: 1

LoanReturn:
  type: object
  required: [return_date]
  properties:
    return_date:
      type: string
      description: Return date in `YYYY-MM-DD` format
      example: "2025-01-31"
 