# Contrato de la Library API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Regla de toda la clase: el contrato de un endpoint se escribe ACÁ antes de programarlo.

openapi: 3.0.3

info:
  title: Library API
  version: 1.0.0
  description: |
    Books, authors and loans of a library.

    **Conventions**
    - All requests and responses are JSON.
    - Dates use the `YYYY-MM-DD` format.
    - All errors have the shape `{ "error": "..." }` (see the `Error` schema).

servers:
  - url: http://localhost:3000

tags:
  - name: Authors
  - name: Books
  - name: Loans
# ──────────────────────────────────────────────────────────────
# Endpoints. Un bloque por ruta; dentro, un bloque por verbo.
# Empezá por /authors. Abajo hay una plantilla comentada para copiar.
# ──────────────────────────────────────────────────────────────
paths: {}
/authors:
    get:
      summary: List all authors
      tags: [Authors]
      responses:
        "200":
          description: List of authors
          content:
            application/json:
            schema:
            type: array
            items:
            $ref: "#/components/schemas/Author"

/authors/{id}:
  get:
    summary: Get author by id
    tags: [Authors]
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: integer}
    responses:
      "200":
        description: Author found
        content:
          application/json:
          schema:
          $ref: "#/components/schemas/Author"
      "400":
        description: Invalid id
        content: 
          application/json:
          schema:
          $ref: "#/components/schemas/Error"
          example:
            error: invalid id
      "404": 
        description: Author not found
        content:
          application/json: 
          schema:
          $ref: "#/components/schemas/Error"
          example:
            error: author not found

  delete:
    summary: Delete an Author
    tags: [Authors]
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: integer}
    responses:
    "204":
      description: Author deleted 
    "400":
        description: Invalid id
        content: 
          application/json:
          schema:
          $ref: "#/components/schemas/Error"
          example:
            error: invalid id
    "404": 
        description: Author not found
        content:
          application/json: 
          schema:
          $ref: "#/components/schemas/Error"
          example:
            error: author not found



/books:
  get:
    summary: List books (paginated)
    tags: [Books]
    parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        schema: { type: integer, minimum: 1, default: 1 }
            in: query
            description: Books per page
            schema: { type: integer, minimum: 1, default: 10 }
    responses:
      "200":
        description: A page of books
        content:
          application/json:
          schema:
          $ref: "#/components/schemas/BookPage"
      "400":
        description: Invalid query parameters
        content:
          application/json:
          schema:
          $ref: "#/components/schemas/Error"
          example:
            error: Invalid query parameters
                
  post:
    summary: Create a book
    tags: [Books]
    requestBody:
      required: true
      content:
      application/json:
        schema:
          $ref: "#/components/schemas/NewBook"
    responses:
      "201":
        description: Book created
        content:
          application/json:
          schema:
          $ref: "#/components/schemas/Book"
      "400":
        description: Invalid book data
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Invalid book data
      "404":
        description: The author does not exist
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Author not found
 
/books/{id}:
  get:
    summary: Get a book by id
    tags: [Books]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    responses:
      "200":
        description: Book found
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Book"
      "400":
        description: Invalid id
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Invalid id
      "404":
        description: Book not found
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Book not found
  patch:
    summary: Partially update a book
    tags: [Books]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        requestBody:
          required: true
          content:
          application/json:
          schema:
          $ref: "#/components/schemas/UpdateBook"
    responses:
      "200":
        description: Book updated
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Book"
      "400":
        description: Invalid id or book data
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Invalid book data
      "404":
        description: Book not found
        content:
        application/json:
        schema:
        $ref: "#/components/schemas/Error"
        example:
          error: Book not found
put:
    summary: Replace a book
    tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBook"
      responses:
        "200":
          description: Book replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Invalid id or book data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid book data
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
    delete:
      summary: Delete a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Book deleted
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid id
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
        "409":
          description: The book has loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book has loans and cannot be deleted

